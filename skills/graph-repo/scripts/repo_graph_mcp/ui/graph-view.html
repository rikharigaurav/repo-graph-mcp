<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Repository graph</title>
<style>:root {
  --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif);
  --mono: var(--font-mono, ui-monospace, "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace);

  --surface: var(--color-background-primary, #ffffff);
  --map: #eef2f4;
  --ink: var(--color-text-primary, #1c2127);
  --ink-2: var(--color-text-secondary, #545e69);
  --ink-3: var(--color-text-tertiary, #87909a);
  --line: var(--color-border-tertiary, #dfe4e8);
  --line-strong: var(--color-border-secondary, #c9d0d6);
  --halo: #eef2f4;
  --focus: #2e6bd9;
  --select: #1c2127;
  --on-kind: #ffffff;

  --region-fill: rgba(70, 96, 120, 0.075);
  --region-stroke: rgba(70, 96, 120, 0.24);
  --region-label: #475a6c;

  --k-folder: #6a7a8c;
  --k-source: #2e6bd9;
  --k-test: #23935a;
  --k-doc: #8a73c9;
  --k-template: #bf8319;
  --k-class: #b3418b;
  --k-function: #0e8794;
  --k-endpoint: #dd4f2b;

  --e-contains: #8f9cab;
  --e-calls: #0e8794;
  --e-imports: #2e6bd9;
  --e-http: #dd4f2b;
  --e-tests: #23935a;
  --e-extends: #b3418b;

  /* GenAI layer */
  --k-ai: #6d3fd1;
  --k-agent: #7341d6;
  --k-step: #9468e3;
  --k-mcp: #3d55c4;
  --k-service: #a65f1c;
  --k-env: #5f8410;
  --e-flow: #7341d6;
  --e-runs: #9468e3;
  --e-uses: #a65f1c;
  --e-env: #5f8410;
  --warn: #d0342c;
  --warn-bg: rgba(208, 52, 44, 0.08);
  --vc-add: #1f9a52;
  --vc-chg: #c4810c;
  --vc-del: #d0342c;
  --live-claude: #c2593a;
  --live-git: #7458c4;

  --radius: var(--border-radius-md, 8px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: var(--color-background-primary, #121518);
    --map: #191d22;
    --ink: var(--color-text-primary, #e7ebef);
    --ink-2: var(--color-text-secondary, #a9b3bd);
    --ink-3: var(--color-text-tertiary, #76818c);
    --line: var(--color-border-tertiary, #2a3138);
    --line-strong: var(--color-border-secondary, #3a434c);
    --halo: #191d22;
    --focus: #6e9eff;
    --select: #e7ebef;
    --on-kind: #0f1418;
    --region-fill: rgba(150, 178, 205, 0.07);
    --region-stroke: rgba(150, 178, 205, 0.22);
    --region-label: #a5b7c9;
    --k-folder: #8e9cac;
    --k-source: #6e9eff;
    --k-test: #4cc485;
    --k-doc: #b4a3ec;
    --k-template: #e3a94a;
    --k-class: #e57cc0;
    --k-function: #36c2cf;
    --k-endpoint: #ff7b57;
    --e-contains: #66727e;
    --e-calls: #36c2cf;
    --e-imports: #6e9eff;
    --e-http: #ff7b57;
    --e-tests: #4cc485;
    --e-extends: #e57cc0;
    --k-ai: #a98bff;
    --k-agent: #a98bff;
    --k-step: #c2a8ff;
    --k-mcp: #8a9dff;
    --k-service: #e39a55;
    --k-env: #a8d24a;
    --e-flow: #a98bff;
    --e-runs: #c2a8ff;
    --e-uses: #e39a55;
    --e-env: #a8d24a;
    --warn: #ff6b61;
    --warn-bg: rgba(255, 107, 97, 0.12);
    --vc-add: #4cc485;
    --vc-chg: #f0b13c;
    --vc-del: #ff6b61;
    --live-claude: #e8906b;
    --live-git: #b4a3ec;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --surface: var(--color-background-primary, #121518);
  --map: #191d22;
  --ink: var(--color-text-primary, #e7ebef);
  --ink-2: var(--color-text-secondary, #a9b3bd);
  --ink-3: var(--color-text-tertiary, #76818c);
  --line: var(--color-border-tertiary, #2a3138);
  --line-strong: var(--color-border-secondary, #3a434c);
  --halo: #191d22;
  --focus: #6e9eff;
  --select: #e7ebef;
  --on-kind: #0f1418;
  --region-fill: rgba(150, 178, 205, 0.07);
  --region-stroke: rgba(150, 178, 205, 0.22);
  --region-label: #a5b7c9;
  --k-folder: #8e9cac;
  --k-source: #6e9eff;
  --k-test: #4cc485;
  --k-doc: #b4a3ec;
  --k-template: #e3a94a;
  --k-class: #e57cc0;
  --k-function: #36c2cf;
  --k-endpoint: #ff7b57;
  --e-contains: #66727e;
  --e-calls: #36c2cf;
  --e-imports: #6e9eff;
  --e-http: #ff7b57;
  --e-tests: #4cc485;
  --e-extends: #e57cc0;
  --k-ai: #a98bff;
  --k-agent: #a98bff;
  --k-step: #c2a8ff;
  --k-mcp: #8a9dff;
  --k-service: #e39a55;
  --k-env: #a8d24a;
  --e-flow: #a98bff;
  --e-runs: #c2a8ff;
  --e-uses: #e39a55;
  --e-env: #a8d24a;
  --warn: #ff6b61;
  --warn-bg: rgba(255, 107, 97, 0.12);
  --vc-add: #4cc485;
  --vc-chg: #f0b13c;
  --vc-del: #ff6b61;
  --live-claude: #e8906b;
  --live-git: #b4a3ec;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface); color: var(--ink); }
body { font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

#app { display: flex; flex-direction: column; height: 600px; min-height: 0; overflow: hidden; background: var(--surface); }

/* header */
.bar { display: flex; align-items: center; gap: 16px; padding-block: 10px 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.title { min-width: 0; flex: 1; }
.title-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.repo { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.repo.is-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.ref { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { margin: 1px 0 0; font-size: 12px; color: var(--ink-3); }
.tools { display: flex; align-items: center; gap: 8px; }
.search-wrap { position: relative; }
#search {
  width: 250px; height: 30px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--surface); color: var(--ink);
}
#search::placeholder { color: var(--ink-3); }
.results {
  position: absolute; z-index: 20; right: 0; top: 34px; width: 340px; max-height: 320px; overflow: auto; margin: 0; padding: 4px;
  list-style: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(20, 30, 40, 0.14);
}
.result { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.result[aria-selected="true"], .result:hover { background: var(--map); }
.result-name { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-path { margin-left: auto; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }

.btn {
  height: 30px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--surface); white-space: nowrap;
}
.btn:hover { background: var(--map); }
.btn-primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn-primary:hover { background: var(--ink); opacity: 0.88; }
.link-btn { border: 0; background: none; padding: 0; color: var(--focus); text-decoration: underline; text-underline-offset: 3px; }

.scope { display: flex; align-items: center; gap: 12px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.scope[hidden] { display: none; }
#scope-label { font-family: var(--mono); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* map */
.stage { position: relative; flex: 1; min-height: 0; background: var(--map); }
.canvas { position: absolute; inset: 0; }
.canvas canvas { display: block; cursor: grab; touch-action: none; }
.canvas canvas:focus-visible { outline-offset: -3px; }

.state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; text-align: center; background: var(--map); }
.state[hidden] { display: none; }
.state-title { margin: 0; font-size: 16px; font-weight: 600; color: var(--ink); }
.state-body { margin: 0; max-width: 46ch; color: var(--ink-2); white-space: pre-wrap; }
.progress { position: relative; width: 160px; height: 3px; margin-top: 12px; overflow: hidden; border-radius: 3px; background: var(--line); }
.progress::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: var(--k-source); animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

.tip {
  position: absolute; z-index: 5; left: 0; top: 0; max-width: 260px; padding: 5px 8px; pointer-events: none;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: 0 4px 14px rgba(20, 30, 40, 0.12);
  display: flex; flex-direction: column;
}
.tip[hidden] { display: none; }
.tip-kind { font-size: 11px; color: var(--ink-3); }
.tip-name { font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.zoom button { width: 34px; height: 28px; border: 0; background: none; font-size: 14px; }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom #fit { font-size: 11.5px; }
.zoom button:hover { background: var(--map); }

.status { position: absolute; left: 16px; bottom: 10px; max-width: min(62%, 520px); margin: 0; font-size: 12px; color: var(--ink-2); pointer-events: none; text-shadow: 0 0 4px var(--map), 0 0 2px var(--map); }

/* details panel */
.panel {
  position: absolute; z-index: 10; top: 10px; right: 10px; bottom: 10px; width: 312px; overflow: auto;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 10px 30px rgba(20, 30, 40, 0.16);
}
.panel[hidden] { display: none; }
.panel-head { position: sticky; top: 0; display: flex; justify-content: flex-end; padding: 6px 6px 0; background: var(--surface); }
.icon-btn { border: 0; background: none; padding: 4px 8px; border-radius: 6px; color: var(--ink-2); font-size: 12px; }
.icon-btn:hover { background: var(--map); color: var(--ink); }
.panel-body { padding: 0 14px 14px; }
.panel-kind { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; font-size: 12px; color: var(--ink-2); }
.panel-title { margin: 0 0 6px; font-size: 16px; line-height: 1.3; font-weight: 650; word-break: break-word; }
.panel-title.is-code { font-family: var(--mono); font-size: 14.5px; font-weight: 600; }
.panel-loc { margin: 0 0 8px; font: 12px var(--mono); color: var(--ink-2); word-break: break-all; }
.link { color: var(--focus); text-decoration: none; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.panel-sig { margin: 0 0 10px; padding: 8px 10px; overflow-x: auto; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; background: var(--map); border-radius: 6px; }
.panel-summary { margin: 0 0 10px; color: var(--ink); }
.panel-facts { margin: 0 0 12px; font-size: 12px; color: var(--ink-3); }
.rel { margin-top: 12px; }
.rel-title { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.rel-list { margin: 0; padding: 0; list-style: none; }
.rel-item { display: flex; align-items: center; gap: 7px; width: 100%; padding: 4px 6px; margin-left: -6px; border: 0; border-radius: 6px; background: none; text-align: left; }
.rel-item:hover { background: var(--map); }
.rel-name { font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rel-path { margin-left: auto; padding-left: 8px; font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; flex-shrink: 1; }
.rel-more { padding: 4px 0; font-size: 12px; color: var(--ink-3); }
.panel-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.glyph { width: 16px; height: 16px; flex: none; }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding-block: 8px 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px 0 7px;
  border: 1px solid transparent; border-radius: 999px; background: none; font-size: 12px; color: var(--ink);
}
.chip:hover { background: var(--map); }
.chip[aria-pressed="false"] { color: var(--ink-3); }
.chip[aria-pressed="false"] .glyph, .chip[aria-pressed="false"] .swatch { opacity: 0.3; }
.chip[aria-pressed="false"] .chip-name { text-decoration: line-through; text-decoration-color: var(--ink-3); }
.chip-count { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.swatch { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
.swatch-contains { border-color: var(--e-contains); border-top-width: 1px; }
.swatch-calls { border-color: var(--e-calls); }
.swatch-imports { border-color: var(--e-imports); border-top-style: dashed; }
.swatch-http { border-color: var(--e-http); border-top-width: 3px; }
.swatch-tests { border-color: var(--e-tests); border-top-style: dotted; }
.swatch-extends { border-color: var(--e-extends); }

#app:not(.ready) .legend, #app:not(.ready) .zoom, #app:not(.ready) .tools { visibility: hidden; }

@media (max-width: 640px) {
  .bar { flex-wrap: wrap; gap: 8px; }
  .tools { width: 100%; }
  .search-wrap, #search { width: 100%; flex: 1; }
  .results { width: 100%; }
  .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 58%; }
  .status { max-width: 70%; }
}

@media (prefers-reduced-motion: reduce) {
  .progress::after { animation: none; width: 100%; opacity: 0.5; }
}

/* GenAI layer details */
.panel-warn { margin: 0 0 10px; padding: 8px 10px; border-radius: var(--radius); background: var(--warn-bg); color: var(--warn); font-size: 12.5px; }
.panel-note { margin: 0; font-size: 12px; color: var(--ink-3); }
.flow-list { list-style: none; margin: 0; padding: 0; }
.flow-step { margin: 0 0 4px; }
.flow-note { margin: -2px 0 0 23px; font-size: 11.5px; color: var(--ink-3); }
.flow-badge { margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 10.5px; line-height: 16px; color: var(--k-agent); border: 1px solid currentColor; }
.swatch-flow { border-color: var(--e-flow); border-top-width: 3px; }
.swatch-runs { border-color: var(--e-runs); border-top-style: dashed; }
.swatch-uses { border-color: var(--e-uses); }
.swatch-env { border-color: var(--e-env); border-top-style: dotted; }

/* view switch */
.seg { display: inline-flex; flex: none; padding: 2px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); }
.seg[hidden] { display: none; }
.seg button { height: 26px; padding: 0 11px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); font-size: 12.5px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-selected="true"] { background: var(--map); color: var(--ink); font-weight: 600; }
#app[data-mode="overview"] .zoom, #app[data-mode="overview"] .status, #app[data-mode="overview"] .legend { display: none; }

/* layered overview */
.overview { position: absolute; inset: 0; z-index: 4; overflow: auto; background: var(--map); }
.overview[hidden] { display: none; }
.ov-board { position: relative; max-width: 1180px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.ov-intro { position: relative; z-index: 1; margin: 0 2px 14px; color: var(--ink-2); }
.ov-intro strong { color: var(--ink); font-weight: 600; }
.ov-grid { --stacked: 0; position: relative; z-index: 1; display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 0 clamp(40px, 6vw, 76px); align-items: start; }
.ov-links { position: absolute; left: 0; top: 0; z-index: 0; overflow: visible; pointer-events: none; }
.ov-col { min-width: 0; }
.ov-col-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin: 0 2px 8px; min-height: 18px; }
.ov-col-title { margin: 0; white-space: nowrap; font-size: 11.5px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.ov-col-sub { margin: 0; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-card { margin-bottom: 12px; padding: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 1px 2px rgba(20, 30, 40, 0.05); }
.ov-sec-title { margin: 3px 7px 3px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
.ov-row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 30px; padding: 4px 8px; border: 0; border-radius: 7px; background: none; text-align: left; transition: opacity 0.15s, background 0.15s; }
.ov-row:hover, .ov-row.is-hot { background: var(--map); }
.ov-name { flex: 1; min-width: 0; font: 12.5px var(--mono); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-prefix { color: var(--ink-3); }
.ov-meta { flex: none; max-width: 48%; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-row.is-warn { background: var(--warn-bg); }
.ov-row.is-warn .ov-name, .ov-row.is-warn .ov-meta { color: var(--warn); }
.ov-row.is-warn { flex-wrap: wrap; row-gap: 0; }
.ov-row.is-warn .ov-name { font-size: 11.5px; }
.ov-row.is-warn .ov-meta { flex-basis: 100%; max-width: none; padding-left: 24px; }
.ov-row.is-more .ov-name { font-family: var(--font); color: var(--ink-2); }
.is-hovering .ov-row:not(.is-hot):not(.is-linked) { opacity: 0.42; }
.ov-link { fill: none; opacity: 0.3; transition: opacity 0.15s; }
.ov-link-runs { stroke-dasharray: 5 4; }
.ov-link.is-long { opacity: 0.14; }
.is-hovering .ov-link { opacity: 0.06; }
.is-hovering .ov-link.is-hot { opacity: 0.95; }
.ov-count { font-size: 11px; font-weight: 600; fill: var(--ink-2); text-anchor: middle; paint-order: stroke; stroke: var(--map); stroke-width: 4px; stroke-linejoin: round; opacity: 0; transition: opacity 0.15s; }
.ov-count.is-hot { opacity: 1; }
.ov-key { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 4px 2px 0; font-size: 12px; color: var(--ink-3); }
.ov-key-word { margin-right: 10px; }
@media (max-width: 760px) {
  .ov-grid { --stacked: 1; grid-template-columns: 1fr; }
  .ov-links { display: none; }
  .seg button { padding: 0 9px; }
}

/* version control */
.vc-chip { display: inline-flex; flex: none; align-items: center; gap: 7px; height: 22px; padding: 0 9px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.vc-chip[hidden] { display: none; }
.vc-chip:hover, .vc-chip[aria-expanded="true"] { background: var(--map); color: var(--ink); }
.vc-branch { font-family: var(--mono); }
.vc-badge { color: var(--ink-3); }
.vc-badge.is-dirty { color: var(--vc-chg); }
.changes-panel { left: 10px; right: auto; z-index: 12; width: 340px; }
.vc-list { list-style: none; margin: 10px 0 0; padding: 0; }
.vc-entry { margin: 0 0 2px; }

.vc-add { color: var(--vc-add); }
.vc-chg { color: var(--vc-chg); }
.vc-del { color: var(--vc-del); }

.ov-banner { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin: 0 2px 12px; padding: 7px 11px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 12.5px; color: var(--ink-2); }

#app.changes-open .ov-board, #app.live-open .ov-board { padding-left: 372px; }

/* UI tab: the repo's own app beside the review of changed files */

.appview[hidden] { display: none; }
.app-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.app-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
.app-bar-left, .app-bar-right { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.app-pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--map); white-space: nowrap; }
.app-pill-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }

.app-pill.is-running .app-pill-dot { background: var(--vc-add); }
.app-pill.is-starting .app-pill-dot, .app-pill.is-installing .app-pill-dot { background: var(--vc-chg); animation: live-blink 0.9s ease-in-out infinite alternate; }
.app-pill.is-failed { color: var(--vc-del); background: color-mix(in srgb, var(--vc-del) 12%, transparent); }
.app-pill.is-failed .app-pill-dot { background: var(--vc-del); }
.app-what { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.app-url { font: 12px var(--mono); color: var(--ink-2); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.app-url:hover { color: var(--ink); text-decoration: underline; }
.app-devices button { height: 28px; padding: 0 10px; font-size: 12px; }
.app-devices button[aria-pressed="true"] { background: var(--map); color: var(--ink); font-weight: 600; }
.app-stage { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; overflow: auto; padding: 12px; }
.app-frame { flex: none; width: 100%; height: 100%; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; box-shadow: 0 6px 24px rgba(20, 30, 40, 0.08); }

.app-stage[data-device="phone"] .app-frame { width: 390px; max-width: 100%; }
.app-frame[hidden] { display: none; }
.app-empty { display: flex; align-items: center; justify-content: center; width: 100%; }
.app-empty[hidden] { display: none; }
.app-empty-box { max-width: 440px; padding: 24px; text-align: left; }
.app-empty-box h3 { margin: 0 0 8px; font-size: 17px; }
.app-empty-box p { margin: 0 0 10px; color: var(--ink-2); line-height: 1.5; }
.app-cmd { display: block; margin: 0 0 12px; padding: 8px 10px; font: 12.5px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; white-space: nowrap; }
.app-note { font-size: 12.5px; }
.app-err { color: var(--vc-del) !important; }
.app-empty-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.app-spinner { width: 22px; height: 22px; margin-bottom: 12px; border: 2.5px solid var(--line-strong); border-top-color: var(--ink); border-radius: 50%; animation: app-spin 0.8s linear infinite; }
@keyframes app-spin { to { transform: rotate(360deg); } }
.app-log { flex: none; height: 180px; margin: 0; padding: 10px 12px; overflow: auto; font: 11.5px/1.5 var(--mono); color: var(--ink-2); background: var(--surface); border-top: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
.app-log[hidden] { display: none; }
.btn-primary:disabled, .btn:disabled { opacity: 0.5; cursor: default; }
.btn-small { height: 26px; padding: 0 9px; font-size: 12px; }
.btn-danger { background: var(--vc-del); border-color: var(--vc-del); color: #fff; }
.btn-danger:hover { background: var(--vc-del); opacity: 0.9; }
.review { min-height: 0; overflow-y: auto; padding: 14px 14px 18px; background: var(--surface); border-left: 1px solid var(--line); }
.review-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.review-title { margin: 0; font-size: 15px; font-weight: 650; }
.review-all { display: flex; align-items: center; gap: 6px; }
.review-confirm { font-size: 12.5px; font-weight: 600; }
.review-sub { margin: 6px 0 10px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
.review-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.review-item { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.review-item.is-added { box-shadow: inset 3px 0 0 var(--vc-add); }
.review-item.is-modified { box-shadow: inset 3px 0 0 var(--vc-chg); }
.review-item.is-deleted { box-shadow: inset 3px 0 0 var(--vc-del); }
.review-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.review-file { display: flex; align-items: baseline; min-width: 0; padding: 0; border: 0; background: none; color: var(--ink); font: 12.5px var(--mono); text-align: left; cursor: pointer; }
.review-file:hover .review-base { text-decoration: underline; }
.review-caret { flex: none; width: 14px; color: var(--ink-3); font-family: var(--sans, inherit); }
.review-dir { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 1; min-width: 0; }
.review-base { font: 600 12.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.review-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 0 14px; font-size: 12px; color: var(--ink-2); }
.review-status { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
.review-status.is-added { color: var(--vc-add); }
.review-status.is-deleted { color: var(--vc-del); }
.review-btns { display: flex; gap: 6px; margin: 8px 0 0 14px; }
.review-diff { margin: 8px 0 0; }
.review-pre { margin: 0; max-height: 320px; overflow: auto; padding: 6px 0; font: 11.5px/1.5 var(--mono); background: var(--map); border-radius: 6px; }
.review-pre span { display: block; padding: 0 8px; white-space: pre; }
.review-pre .d-add { background: color-mix(in srgb, var(--vc-add) 16%, transparent); }
.review-pre .d-del { background: color-mix(in srgb, var(--vc-del) 14%, transparent); }

.review-undone { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line); }
.review-item.is-undone { padding: 7px 10px; }
.review-item.is-undone .review-meta { margin-left: 0; }
.tab-count { display: inline-block; min-width: 16px; height: 16px; margin-left: 6px; padding: 0 4px; border-radius: 999px; font-size: 10.5px; font-weight: 700; line-height: 16px; text-align: center; color: #fff; background: var(--vc-chg); vertical-align: 1px; }
.toast { position: absolute; left: 50%; bottom: 18px; z-index: 40; transform: translateX(-50%); max-width: min(520px, calc(100% - 32px)); padding: 9px 14px; border-radius: 8px; font-size: 13px; color: var(--surface); background: var(--ink); box-shadow: 0 8px 24px rgba(20, 30, 40, 0.2); }
@media (max-width: 900px) {
  .appview { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 45%); }
  .review { border-left: 0; border-top: 1px solid var(--line); }

/* live view */
.seg button[hidden] { display: none; }
.live-tab-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--vc-add); vertical-align: 1px; }
.live-panel { width: 340px; }
.live-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; }
.live-head .panel-kind { margin: 0; }
.live-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.live-pulse { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--vc-add); }
.live-status.is-open .live-pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--vc-add); opacity: 0; animation: live-ping 2.4s ease-out infinite; }
.live-status.is-building .live-pulse { background: var(--vc-chg); animation: live-blink 0.9s ease-in-out infinite alternate; }

@keyframes live-ping { 0% { transform: scale(0.6); opacity: 0.7; } 100% { transform: scale(1.6); opacity: 0; } }
@keyframes live-blink { from { opacity: 1; } to { opacity: 0.35; } }
.live-body .panel-title { margin-top: 6px; }
.live-facts { line-height: 1.6; }
.live-hook { color: var(--live-claude); }

.live-follow { display: flex; align-items: center; gap: 8px; margin: 0 0 4px -2px; padding: 4px 2px; border: 0; background: none; color: var(--ink-2); font-size: 12px; text-align: left; }
.live-follow:hover { color: var(--ink); }
.live-follow-box { position: relative; flex: none; width: 14px; height: 14px; border: 1.5px solid var(--line-strong); border-radius: 4px; background: var(--surface); }
.live-follow[aria-pressed="true"] .live-follow-box { border-color: var(--ink); background: var(--ink); }

.live-list { margin-top: 6px; }
.live-feed { margin-top: 2px; padding-top: 6px; border-top: 1px solid var(--line); }
.vc-dot.is-since { background: var(--ink); }
.live-src { flex: none; padding: 0 6px; border-radius: 999px; font-size: 10.5px; font-weight: 600; line-height: 17px; color: var(--ink-2); background: var(--map); white-space: nowrap; }
.live-src.is-claude { color: var(--live-claude); background: color-mix(in srgb, var(--live-claude) 13%, transparent); }
.live-src.is-git { color: var(--live-git); background: color-mix(in srgb, var(--live-git) 13%, transparent); }
.live-item .vc-sub { padding-left: 0; }
.live-item.is-since .vc-sub { padding-left: 15px; }
.live-time { font-variant-numeric: tabular-nums; }
.live-item.is-new { animation: live-arrive 2.4s ease-out; }
@keyframes live-arrive { 0% { background: color-mix(in srgb, var(--vc-chg) 22%, transparent); } 100% { background: transparent; } }
.live-item.is-new.is-selected { animation: none; }
.live-empty { padding: 8px 2px 4px; font-size: 12px; color: var(--ink-3); }
.live-empty p { margin: 0 0 8px; }

@keyframes ov-flash {
  0%, 30% { background: color-mix(in srgb, var(--vc-chg) 26%, var(--surface)); box-shadow: inset 2px 0 0 var(--vc-chg), 0 0 0 3px color-mix(in srgb, var(--vc-chg) 30%, transparent); }
  100% { background: transparent; }
}

}

  .live-panel { width: auto; }

<div id="app">
  <header class="bar">
    <div class="title">
      <div class="title-line">
        <a id="repo" class="repo" href="#" rel="noopener">Repository</a>
        <span id="ref" class="ref"></span>
        <button id="vc" class="vc-chip" type="button" aria-expanded="false" aria-controls="changes" hidden></button>
      </div>
      <p id="meta" class="meta"></p>
    </div>

        <button type="button" role="tab" data-mode="live" hidden><span class="live-tab-dot" aria-hidden="true"></span>Live</button>
        <button type="button" role="tab" data-mode="ui" hidden title="Your app, and the changes to accept or undo">UI</button>
      </div>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Find a file, function or route" autocomplete="off" spellcheck="false"
               role="combobox" aria-label="Find a node" aria-autocomplete="list" aria-controls="results" aria-expanded="false">
        <ul id="results" class="results" role="listbox" hidden></ul>
      </div>
      <button id="fullscreen" class="btn" type="button" hidden>Full screen</button>
    </div>
  </header>
  <div id="scope" class="scope" hidden>
    <span id="scope-label"></span>
    <button id="scope-reset" class="link-btn" type="button">Show whole repo</button>
    <button id="scope-overview" class="link-btn" type="button" hidden>Back to overview</button>
  </div>
  <main class="stage">
    <div id="canvas" class="canvas"></div>
    <div id="overview" class="overview" hidden></div>
    <section id="appview" class="appview" aria-label="Your app and the changes to review" hidden></section>
    <div id="state" class="state"></div>
    <div id="tip" class="tip" hidden></div>
    <aside id="panel" class="panel" aria-label="Node details" hidden></aside>
    <aside id="changes" class="panel changes-panel" aria-label="Changes" hidden></aside>
    <aside id="live" class="panel changes-panel live-panel" aria-label="Live changes" hidden></aside>
    <div class="zoom" role="group" aria-label="Zoom">
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
      <button id="fit" type="button" aria-label="Fit graph to view">Fit</button>
    </div>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <footer class="legend">
    <div id="kinds" class="chips" role="group" aria-label="Show or hide node kinds"></div>
    <div id="groups" class="chips" role="group" aria-label="Show or hide link kinds"></div>
  </footer>
