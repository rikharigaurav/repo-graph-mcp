[project]
name = "repo-graph-mcp"
version = "0.3.0"
description = "Claude plugin / MCP server: parse a repository into a code-structure graph and show it interactively in the chat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Gaurav Rikhari" }]
keywords = ["mcp", "mcp-apps", "claude", "code-graph", "tree-sitter", "neo4j"]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "anyio>=4",
  "uvicorn>=0.30",
  "starlette>=0.40",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-python>=0.25",
  "tree-sitter-javascript>=0.25",
  "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
repo-graph-mcp = "repo_graph_mcp.server:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_graph_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
